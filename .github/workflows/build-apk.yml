name: Build MRP Admin APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK Platforms & Build-Tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create Android WebView Project & Build APK
        run: |
          mkdir -p app/src/main/java/com/example/mrpadmin app/src/main/res/layout app/src/main/res/values app/src/main/assets

          cp index.html app/src/main/assets/index.html
          for d in css js assets images img fonts; do
            if [ -d "$d" ]; then
              cp -r "$d" app/src/main/assets/
            fi
          done

          cat << 'EOF' > settings.gradle
          rootProject.name = "MRPAdmin"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath "com.android.tools.build:gradle:8.2.2"
            }
          }
          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
            id "com.android.application"
          }
          android {
            namespace "com.example.mrpadmin"
            compileSdk 34

            defaultConfig {
              applicationId "com.example.mrpadmin"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }

            buildTypes {
              release {
                minifyEnabled false
              }
              debug {
                minifyEnabled false
              }
            }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
              android:label="MRP Admin"
              android:usesCleartextTraffic="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/mrpadmin/MainActivity.java
          package com.example.mrpadmin;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              webView = new WebView(this);
              setContentView(webView);

              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setAllowFileAccess(true);
              settings.setAllowContentAccess(true);
              settings.setMediaPlaybackRequiresUserGesture(false);

              webView.setWebViewClient(new WebViewClient());
              webView.loadUrl("file:///android_asset/index.html");
            }

            @Override
            public void onBackPressed() {
              if (webView != null && webView.canGoBack()) {
                webView.goBack();
              } else {
                super.onBackPressed();
              }
            }
          }
          EOF

          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MRP-Admin-APK
          path: "app/build/outputs/apk/debug/*.apk"
